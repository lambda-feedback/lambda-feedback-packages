[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lambdafeedback-physical-quantities"
version = "0.3.0rc5"
description = "Parse physical quantities such as 9.81 m/s^2 into value and unit, with SI conversion and dimensional analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lambda Feedback contributors" }]
keywords = ["units", "physical-quantities", "dimensional-analysis", "si-units", "sympy", "lambda-feedback"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "lambdafeedback-slr-parsing (>=0.3.0rc5,<0.4.0)",
    "lambdafeedback-expression-parsing (>=0.3.0rc5,<0.4.0)",
    "sympy (>=1.14,<2.0)",
]

[project.urls]
Repository = "https://github.com/lambda-feedback/lambda-feedback-packages"
Changelog = "https://github.com/lambda-feedback/lambda-feedback-packages/blob/main/physical_quantities/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "lambdafeedback/physical_quantities", from = "src" }]
# The source distribution also carries the changelog and the tests.
include = [{ path = "CHANGELOG.md", format = "sdist" }, { path = "tests", format = "sdist" }]

# Resolve sibling packages from the monorepo during development; published
# metadata keeps the plain requirements from [project.dependencies].
[tool.poetry.dependencies]
lambdafeedback-slr-parsing = { path = "../slr_parsing", develop = true }
lambdafeedback-expression-parsing = { path = "../expression_parsing", develop = true }
