
[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lambdafeedback-expression-parsing"
version = "0.3.0"
description = "Safe SymPy parsing and preprocessing of learner-written mathematical expressions, for Lambda Feedback evaluation functions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lambda Feedback contributors" }]
keywords = ["sympy", "parsing", "mathematics", "education", "lambda-feedback"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "lambdafeedback-slr-parsing (>=0.2.0,<0.3.0)",
    "sympy (>=1.14,<2.0)",
    "latex2sympy2-extended[antlr4-13-2] (>=1.11.0,<2.0)",
]

[project.urls]
Repository = "https://github.com/m-messer/lambda-feedback-packages"
Changelog = "https://github.com/m-messer/lambda-feedback-packages/blob/main/expression_parsing/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "lambdafeedback/expression_parsing", from = "src" }]
# The source distribution also carries the changelog and the tests.
include = [{ path = "CHANGELOG.md", format = "sdist" }, { path = "tests", format = "sdist" }]

# Resolve sibling packages from the monorepo during development; published
# metadata keeps the plain requirements from [project.dependencies].
[tool.poetry.dependencies]
lambdafeedback-slr-parsing = { path = "../slr_parsing", develop = true }
