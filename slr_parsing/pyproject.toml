[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lambdafeedback-slr-parsing"
version = "0.3.0rc1"
description = "Dependency-free SLR(1) parser generator for Lambda Feedback evaluation functions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lambda Feedback contributors" }]
keywords = ["parser", "slr", "lr-parser", "parser-generator", "lambda-feedback"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/lambda-feedback/lambda-feedback-packages"
Changelog = "https://github.com/lambda-feedback/lambda-feedback-packages/blob/main/slr_parsing/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "lambdafeedback/slr_parsing", from = "src" }]
# The source distribution also carries the changelog and the tests.
include = [{ path = "CHANGELOG.md", format = "sdist" }, { path = "tests", format = "sdist" }]
