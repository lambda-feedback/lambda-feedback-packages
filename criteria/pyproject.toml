[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lambdafeedback-criteria"
version = "0.3.0"
description = "Criteria parser and criteria graphs that turn evaluations into feedback, for Lambda Feedback evaluation functions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lambda Feedback contributors" }]
keywords = ["criteria", "feedback", "assessment", "evaluation", "lambda-feedback"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "lambdafeedback-slr-parsing (>=0.3.0,<0.4.0)",
]

[project.urls]
Repository = "https://github.com/lambda-feedback/lambda-feedback-packages"
Changelog = "https://github.com/lambda-feedback/lambda-feedback-packages/blob/main/criteria/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "lambdafeedback/criteria", from = "src" }]
# The source distribution also carries the changelog and the tests.
include = [{ path = "CHANGELOG.md", format = "sdist" }, { path = "tests", format = "sdist" }]

# Resolve sibling packages from the monorepo during development; published
# metadata keeps the plain requirements from [project.dependencies].
[tool.poetry.dependencies]
lambdafeedback-slr-parsing = { path = "../slr_parsing", develop = true }
