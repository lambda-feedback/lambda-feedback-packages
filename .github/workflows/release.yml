name: Release

# A release of all four packages: push a semantic-version tag vMAJOR.MINOR.PATCH,
# for example `v0.3.0`, matching every package's pyproject.toml.
# Pre-releases (v0.4.0-rc.1, ...) go through prerelease.yml instead.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      prerelease: false